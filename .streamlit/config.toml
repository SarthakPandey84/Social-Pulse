[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0284C7"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
font = "sans serif"
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkColor = "#0284C7"
